<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>เขาวงกตสายรุ้ง</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;-webkit-user-select:none;user-select:none}
html,body{height:100%;background:#1b0b3a;font-family:Kanit,system-ui,sans-serif;color:#fff;overflow:hidden;touch-action:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated}
#hud{position:fixed;top:0;left:0;right:0;display:flex;gap:8px;padding:10px;flex-wrap:wrap;justify-content:center;align-items:center}
.chip{background:rgba(25,6,60,.72);border:2px solid var(--c);border-radius:14px;padding:4px 14px;font-weight:700;font-size:17px;box-shadow:0 0 14px var(--c)}
.chip small{font-weight:400;opacity:.8;margin-right:6px}
#time.low{animation:blink .5s infinite alternate;color:#ff6b6b}
@keyframes blink{to{background:#a00018}}
button{font-family:inherit;cursor:pointer}
#restart{background:linear-gradient(135deg,#ff4fd8,#ff9a3c);border:0;color:#fff;font-weight:700;font-size:16px;padding:7px 16px;border-radius:14px;box-shadow:0 4px 0 #8c2a7a}
#restart:active{transform:translateY(3px);box-shadow:0 1px 0 #8c2a7a}
#mini{position:fixed;right:10px;top:70px;width:140px;height:140px;border:3px solid #3cf2ff;border-radius:12px;background:#12062b;box-shadow:0 0 16px #3cf2ff}
#toast{position:fixed;left:0;right:0;top:34%;text-align:center;font-size:40px;font-weight:700;color:#ffe45e;text-shadow:0 3px 0 #b05a00,0 0 20px #ffb800;opacity:0;transition:opacity .25s;pointer-events:none}
.pad{position:fixed;bottom:18px;display:flex;gap:12px}
#padL{left:16px}#padR{right:16px}
.pad button{width:72px;height:72px;border-radius:50%;border:3px solid #fff;font-size:28px;color:#fff;background:rgba(255,79,216,.55);touch-action:none}
#padR button{background:rgba(60,242,255,.5)}
.pad button.on{transform:scale(.92);filter:brightness(1.4)}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(15,3,40,.7);padding:16px}
#ov.hide{display:none}
.panel{max-width:440px;width:100%;text-align:center;padding:28px 24px;border-radius:24px;background:#26104f;border:4px solid transparent;background:linear-gradient(#26104f,#26104f) padding-box,linear-gradient(135deg,#ff4fd8,#ffe45e,#3cf2ff) border-box;box-shadow:0 0 40px rgba(255,79,216,.5)}
.panel h1{font-size:36px;line-height:1.2;margin-bottom:10px;background:linear-gradient(90deg,#ff4fd8,#ffe45e,#3cf2ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.panel p{margin:6px 0;font-size:16px;line-height:1.5;color:#e6dcff}
.panel b{color:#ffe45e}
#go{margin-top:18px;font-size:22px;font-weight:700;color:#fff;border:0;padding:12px 34px;border-radius:18px;background:linear-gradient(135deg,#27d17f,#3cf2ff);box-shadow:0 5px 0 #0b7a5a}
#go:active{transform:translateY(4px);box-shadow:0 1px 0 #0b7a5a}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div class="chip" style="--c:#ff4fd8"><small>ด่าน</small><span id="lv">1</span></div>
  <div class="chip" id="time" style="--c:#3cf2ff"><small>เวลา</small><span id="tm">0:00</span></div>
  <div class="chip" style="--c:#ffe45e"><small>เหรียญ</small><span id="cn">0/0</span></div>
  <div class="chip" style="--c:#27d17f"><small>คะแนน</small><span id="sc">0</span></div>
  <button id="restart">เริ่มใหม่</button>
</div>
<canvas id="mini" width="140" height="140"></canvas>
<div id="toast"></div>
<div class="pad" id="padL"><button data-k="ArrowLeft">◀</button><button data-k="ArrowRight">▶</button></div>
<div class="pad" id="padR"><button data-k="ArrowUp">▲</button><button data-k="ArrowDown">▼</button></div>
<div id="ov"><div class="panel"><h1 id="ot"></h1><div id="ob"></div><button id="go"></button></div></div>

<script>
const cv=document.getElementById('game'),g=cv.getContext('2d'),mc=document.getElementById('mini'),m2=mc.getContext('2d');
const $=id=>document.getElementById(id);
let W,H,zb=[],map,n,w,L=1,score=0,coins=[],got=0,total=0,timeLeft=0,seen,state='start',p={x:1.5,y:1.5,a:0},exit={x:0,y:0},best=0;
try{best=+localStorage.getItem('mazeBest')||0}catch(e){}

function resize(){const s=Math.min(1,800/innerWidth);W=Math.floor(innerWidth*s);H=Math.floor(innerHeight*s);cv.width=W;cv.height=H;zb=new Float32Array(W)}
addEventListener('resize',resize);resize();

/* ---------- สร้างเขาวงกต ---------- */
function gen(n){
  const w=2*n+1,m=Array.from({length:w},()=>Array(w).fill(1)),vis=new Set(['0,0']),st=[[0,0]];
  m[1][1]=0;
  while(st.length){
    const[cx,cy]=st[st.length-1];
    const nb=[[1,0],[-1,0],[0,1],[0,-1]].map(([a,b])=>[cx+a,cy+b,a,b]).filter(([x,y])=>x>=0&&y>=0&&x<n&&y<n&&!vis.has(x+','+y));
    if(!nb.length){st.pop();continue}
    const[x,y,a,b]=nb[Math.random()*nb.length|0];
    vis.add(x+','+y);m[2*cy+1+b][2*cx+1+a]=0;m[2*y+1][2*x+1]=0;st.push([x,y]);
  }
  return m;
}
function setup(){
  n=Math.min(4+L,18);w=2*n+1;map=gen(n);
  // ด่านแรกๆ มีทางลัดเยอะ ยิ่งสูงยิ่งน้อย
  let k=Math.max(0,Math.round((9-L)*n/3));
  for(let i=0;i<400&&k>0;i++){
    const x=1+Math.random()*(w-2)|0,y=1+Math.random()*(w-2)|0;
    if(map[y][x]===1&&(x+y)%2===1&&((map[y][x-1]===0&&map[y][x+1]===0)||(map[y-1][x]===0&&map[y+1][x]===0))){map[y][x]=0;k--}
  }
  exit={x:2*n-.5,y:2*n-.5};
  const cells=[];
  for(let y=1;y<w;y+=2)for(let x=1;x<w;x+=2)if(!(x===1&&y===1)&&!(x===2*n-1&&y===2*n-1))cells.push([x+.5,y+.5]);
  for(let i=cells.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[cells[i],cells[j]]=[cells[j],cells[i]]}
  total=Math.min(3+L,16);coins=cells.slice(0,total).map(c=>({x:c[0],y:c[1],on:true}));got=0;
  timeLeft=Math.round((30+n*n*1.2)*Math.max(.55,1-(L-1)*.035));
  seen=Array.from({length:w},()=>Array(w).fill(false));
  p={x:1.5,y:1.5,a:map[1][2]===0?0:Math.PI/2};
}

/* ---------- เสียง ---------- */
let ac;
function beep(f,d=.12,type='square'){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),v=ac.createGain();o.type=type;o.frequency.value=f;v.gain.value=.06;o.connect(v);v.connect(ac.destination);o.start();v.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(e){}}
let tt;function toast(s){const t=$('toast');t.textContent=s;t.style.opacity=1;clearTimeout(tt);tt=setTimeout(()=>t.style.opacity=0,700)}

/* ---------- ปุ่มควบคุม ---------- */
const keys={};
addEventListener('keydown',e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();
  keys[e.code]=1;
  if((e.code==='Enter'||e.code==='Space')&&state!=='play')$('go').click();
  if(e.code==='KeyR')restart();
});
addEventListener('keyup',e=>keys[e.code]=0);
document.querySelectorAll('.pad button').forEach(b=>{
  const k=b.dataset.k,on=e=>{e.preventDefault();keys[k]=1;b.classList.add('on')},off=()=>{keys[k]=0;b.classList.remove('on')};
  b.addEventListener('pointerdown',on);['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,off));
});
cv.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'&&e.buttons&&state==='play')p.a+=e.movementX*.006});

/* ---------- เกมหลัก ---------- */
const wall=(x,y)=>map[y|0][x|0]===1;
function tryMove(dx,dy){const r=.22;if(!wall(p.x+dx+Math.sign(dx)*r,p.y))p.x+=dx;if(!wall(p.x,p.y+dy+Math.sign(dy)*r))p.y+=dy}
function update(dt){
  const rot=(keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0);p.a+=rot*2.4*dt;
  const f=((keys.ArrowUp||keys.KeyW)?1:0)-((keys.ArrowDown||keys.KeyS)?1:0);
  const s=(keys.KeyD?1:0)-(keys.KeyA?1:0),sp=3*dt,c=Math.cos(p.a),sn=Math.sin(p.a);
  tryMove((c*f-sn*s)*sp,(sn*f+c*s)*sp);
  for(let y=-2;y<=2;y++)for(let x=-2;x<=2;x++){const cx=(p.x|0)+x,cy=(p.y|0)+y;if(cx>=0&&cy>=0&&cx<w&&cy<w&&x*x+y*y<=5)seen[cy][cx]=true}
  for(const q of coins)if(q.on&&Math.hypot(q.x-p.x,q.y-p.y)<.45){q.on=false;got++;score+=50;timeLeft+=3;beep(880,.1);setTimeout(()=>beep(1320,.12),70);toast('+50  +3 วินาที')}
  if(Math.hypot(exit.x-p.x,exit.y-p.y)<.55){
    const bonus=100*L+Math.ceil(timeLeft)*5+got*20;score+=bonus;state='levelup';beep(660,.15);setTimeout(()=>beep(990,.3),150);
    showOv(`ผ่านด่าน ${L}!`,`<p>เก็บเหรียญ <b>${got}/${total}</b></p><p>โบนัสผ่านด่าน <b>+${bonus}</b></p><p>คะแนนรวม <b>${score}</b></p><p>ด่านต่อไปเขาวงกตใหญ่ขึ้นและเวลาน้อยลง</p>`,'ด่านต่อไป');
  }
  timeLeft-=dt;
  if(timeLeft<=0){timeLeft=0;state='over';beep(180,.5,'sawtooth');
    if(score>best){best=score;try{localStorage.setItem('mazeBest',best)}catch(e){}}
    showOv('หมดเวลา!',`<p>ไปถึงด่านที่ <b>${L}</b></p><p>คะแนน <b>${score}</b></p><p>คะแนนสูงสุด <b>${best}</b></p>`,'เล่นอีกครั้ง');}
}

/* ---------- เรนเดอร์ มุมมองบุคคลที่หนึ่ง ---------- */
function spr(sx,sy,col,rw,rh,vo,px,py,dx,dy){
  const rx=sx-p.x,ry=sy-p.y,inv=1/(px*dy-dx*py),tx=inv*(dy*rx-dx*ry),ty=inv*(-py*rx+px*ry);
  if(ty<.15)return;
  const sc=(W/2)*(1+tx/ty),sz=H/ty,r=sz*rw,hh=sz*rh,cy=H/2+sz*vo;
  g.fillStyle=col;
  for(let x=Math.max(0,Math.floor(sc-r));x<Math.min(W,sc+r);x++){
    if(zb[x]<ty)continue;
    const u=(x-sc)/r,c=Math.sqrt(Math.max(0,1-u*u));
    g.fillRect(x,cy-hh*c,1,hh*2*c);
  }
}
function render(t){
  const hue=(L*47)%360,hh=H/2;
  let gr=g.createLinearGradient(0,0,0,hh);gr.addColorStop(0,`hsl(${hue+210},85%,22%)`);gr.addColorStop(1,`hsl(${hue+300},90%,62%)`);
  g.fillStyle=gr;g.fillRect(0,0,W,hh+1);
  gr=g.createLinearGradient(0,hh,0,H);gr.addColorStop(0,`hsl(${hue+120},70%,20%)`);gr.addColorStop(1,`hsl(${hue+160},80%,48%)`);
  g.fillStyle=gr;g.fillRect(0,hh,W,hh);
  if(!map)return;
  const dx=Math.cos(p.a),dy=Math.sin(p.a),px=-dy*.66,py=dx*.66;
  for(let x=0;x<W;x++){
    const cam=2*x/W-1,rx=(dx+px*cam)||1e-9,ry=(dy+py*cam)||1e-9;
    let mx=p.x|0,my=p.y|0;const ddx=Math.abs(1/rx),ddy=Math.abs(1/ry);
    let sx,sy,sdx,sdy,side=0;
    if(rx<0){sx=-1;sdx=(p.x-mx)*ddx}else{sx=1;sdx=(mx+1-p.x)*ddx}
    if(ry<0){sy=-1;sdy=(p.y-my)*ddy}else{sy=1;sdy=(my+1-p.y)*ddy}
    while(true){
      if(sdx<sdy){sdx+=ddx;mx+=sx;side=0}else{sdy+=ddy;my+=sy;side=1}
      if(map[my][mx]===1)break;
    }
    const d=Math.max(.05,side?sdy-ddy:sdx-ddx);zb[x]=d;
    const lh=H/d,top=(H-lh)/2;
    let wx=side?p.x+d*rx:p.y+d*ry;wx-=Math.floor(wx);
    const hv=(hue+(mx*29+my*53)%140)%360,fog=Math.max(.3,1-d/10),l=(side?44:58)*fog;
    g.fillStyle=`hsl(${hv},88%,${l}%)`;g.fillRect(x,top,1,lh);
    g.fillStyle='rgba(0,0,0,.22)';
    g.fillRect(x,top+lh*.33,1,Math.max(1,lh*.03));g.fillRect(x,top+lh*.66,1,Math.max(1,lh*.03));
    if(wx<.04||(wx>.48&&wx<.52))g.fillRect(x,top,1,lh);
  }
  // สไปรต์: เหรียญและประตูทางออก
  const list=coins.filter(q=>q.on).map(q=>({q,d:(q.x-p.x)**2+(q.y-p.y)**2}));
  list.push({q:exit,d:(exit.x-p.x)**2+(exit.y-p.y)**2,ex:1});
  list.sort((a,b)=>b.d-a.d);
  for(const o of list){
    if(o.ex){
      const pul=.5+.5*Math.sin(t*4);
      spr(exit.x,exit.y,`hsl(${t*120%360},100%,60%)`,.34+.04*pul,.5,0,px,py,dx,dy);
      spr(exit.x,exit.y,'#fff',.2,.36+.05*pul,0,px,py,dx,dy);
    }else{
      const sw=.06+.15*Math.abs(Math.cos(t*3+o.q.x*2)),bob=.12+.06*Math.sin(t*3+o.q.y);
      spr(o.q.x,o.q.y,'#ff9500',.16*(sw/.21)+.02,.2,bob,px,py,dx,dy);
      spr(o.q.x,o.q.y,'#ffe45e',(.12*(sw/.21)+.01),.15,bob,px,py,dx,dy);
    }
  }
  // แผนที่ย่อ (เห็นเฉพาะส่วนที่เคยสำรวจ)
  const cs=140/w;m2.fillStyle='#12062b';m2.fillRect(0,0,140,140);
  for(let y=0;y<w;y++)for(let x=0;x<w;x++)if(seen[y][x]){
    m2.fillStyle=map[y][x]?`hsl(${(hue+(x*29+y*53)%140)%360},80%,50%)`:'#3b2a73';
    m2.fillRect(x*cs,y*cs,cs+.5,cs+.5);
  }
  if(seen[exit.y|0][exit.x|0]){m2.fillStyle='#3cf2ff';m2.fillRect(exit.x*cs-cs/2,exit.y*cs-cs/2,cs,cs)}
  m2.fillStyle='#ffe45e';
  for(const q of coins)if(q.on&&seen[q.y|0][q.x|0]){m2.beginPath();m2.arc(q.x*cs,q.y*cs,Math.max(1.5,cs/3),0,7);m2.fill()}
  m2.save();m2.translate(p.x*cs,p.y*cs);m2.rotate(p.a);m2.fillStyle='#ff4fd8';
  const r=Math.max(3,cs*.7);m2.beginPath();m2.moveTo(r,0);m2.lineTo(-r*.7,r*.7);m2.lineTo(-r*.7,-r*.7);m2.fill();m2.restore();
}

/* ---------- UI ---------- */
function showOv(t,b,btn){$('ot').textContent=t;$('ob').innerHTML=b;$('go').textContent=btn;$('ov').classList.remove('hide')}
function hud(){
  $('lv').textContent=L;$('cn').textContent=got+'/'+total;$('sc').textContent=score;
  const s=Math.ceil(timeLeft);$('tm').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
  $('time').classList.toggle('low',state==='play'&&timeLeft<10);
}
function begin(){$('ov').classList.add('hide');state='play';for(const k in keys)keys[k]=0}
function restart(){L=1;score=0;setup();begin()}
$('restart').onclick=e=>{e.currentTarget.blur();restart()};
$('go').onclick=()=>{
  if(state==='start'){restart()}
  else if(state==='levelup'){L++;setup();begin()}
  else if(state==='over'){restart()}
};
showOv('เขาวงกตสายรุ้ง',
 `<p>หาทางไปยังประตูทางออกสีรุ้งให้ทันเวลา เก็บเหรียญทองเพื่อรับ <b>+50 คะแนน</b> และ <b>+3 วินาที</b></p>
  <p><b>W / ↑</b> เดินหน้า &nbsp; <b>S / ↓</b> ถอยหลัง<br><b>← →</b> หันซ้าย–ขวา &nbsp; <b>A / D</b> เดินข้าง<br>ลากเมาส์เพื่อหมุนมุมมอง &nbsp; <b>R</b> เริ่มใหม่<br>มือถือ: ใช้ปุ่มบนหน้าจอ</p>`,'เริ่มเล่น');
setup();

let last=0;
function frame(ts){
  const dt=Math.min(.05,(ts-last)/1000);last=ts;
  if(state==='play')update(dt);
  render(ts/1000);hud();requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
